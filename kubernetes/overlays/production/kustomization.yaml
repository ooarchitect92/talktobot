apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: production-config.yaml

# Deployment automation must replace both tags with the exact release SHA or
# digest produced by .github/workflows/release.yml before applying this overlay.
images:
  - name: northstar/api
    newName: ghcr.io/ooarchitect92/talktobot-api
    newTag: replace-with-release-sha
  - name: northstar/web
    newName: ghcr.io/ooarchitect92/talktobot-web
    newTag: replace-with-release-sha
  - name: northstar/website
    newName: ghcr.io/ooarchitect92/talktobot-website
    newTag: replace-with-release-sha

# Provider qualification is absent: external delivery workers must remain stopped.
replicas:
  - {name: northstar-crm-router, count: 0}
  - {name: northstar-crm-delivery, count: 0}
  - {name: northstar-crm-reconciliation, count: 0}
  - {name: northstar-crm-health-monitor, count: 0}
  - {name: northstar-crm-webhook-consumer, count: 0}
  - {name: northstar-channel-event-consumer, count: 0}
  - {name: northstar-channel-health-monitor, count: 0}
