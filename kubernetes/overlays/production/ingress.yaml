apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northstar
  namespace: northstar
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [talktobot.io, app.talktobot.io, api.talktobot.io]
      secretName: northstar-tls
  rules:
    - host: app.talktobot.io
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: northstar-web, port: {name: http}}
    - host: talktobot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: website, port: {name: http}}
    - host: api.talktobot.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
