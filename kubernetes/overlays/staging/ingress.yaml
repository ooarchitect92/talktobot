apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northstar
  namespace: northstar
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/inbound-cidrs: "192.0.2.1/32"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:510439383733:certificate/04cd6697-9b51-4eea-b573-eae1b047525b
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180
    alb.ingress.kubernetes.io/tags: Project=TalkToBot,Environment=staging
spec:
  ingressClassName: alb
  rules:
    - host: app.staging.talktobot.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: northstar-web, port: {name: http}}
    - host: staging.talktobot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: website, port: {name: http}}
    - host: api.staging.talktobot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
