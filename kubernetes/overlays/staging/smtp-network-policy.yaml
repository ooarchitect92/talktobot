# Positive SMTP ranges avoid ipBlock except rules overriding other AWS CNI allow rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: staging-transactional-smtp
  namespace: northstar
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: NotIn
      values:
      - northstar-web
      - northstar-website
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/5
    - ipBlock:
        cidr: 8.0.0.0/7
    - ipBlock:
        cidr: 11.0.0.0/8
    - ipBlock:
        cidr: 12.0.0.0/6
    - ipBlock:
        cidr: 16.0.0.0/4
    - ipBlock:
        cidr: 32.0.0.0/3
    - ipBlock:
        cidr: 64.0.0.0/3
    - ipBlock:
        cidr: 96.0.0.0/4
    - ipBlock:
        cidr: 112.0.0.0/5
    - ipBlock:
        cidr: 120.0.0.0/6
    - ipBlock:
        cidr: 124.0.0.0/7
    - ipBlock:
        cidr: 126.0.0.0/8
    - ipBlock:
        cidr: 128.0.0.0/3
    - ipBlock:
        cidr: 160.0.0.0/5
    - ipBlock:
        cidr: 168.0.0.0/8
    - ipBlock:
        cidr: 169.0.0.0/9
    - ipBlock:
        cidr: 169.128.0.0/10
    - ipBlock:
        cidr: 169.192.0.0/11
    - ipBlock:
        cidr: 169.224.0.0/12
    - ipBlock:
        cidr: 169.240.0.0/13
    - ipBlock:
        cidr: 169.248.0.0/14
    - ipBlock:
        cidr: 169.252.0.0/15
    - ipBlock:
        cidr: 169.255.0.0/16
    - ipBlock:
        cidr: 170.0.0.0/7
    - ipBlock:
        cidr: 172.0.0.0/12
    - ipBlock:
        cidr: 172.32.0.0/11
    - ipBlock:
        cidr: 172.64.0.0/10
    - ipBlock:
        cidr: 172.128.0.0/9
    - ipBlock:
        cidr: 173.0.0.0/8
    - ipBlock:
        cidr: 174.0.0.0/7
    - ipBlock:
        cidr: 176.0.0.0/4
    - ipBlock:
        cidr: 192.0.0.0/9
    - ipBlock:
        cidr: 192.128.0.0/11
    - ipBlock:
        cidr: 192.160.0.0/13
    - ipBlock:
        cidr: 192.169.0.0/16
    - ipBlock:
        cidr: 192.170.0.0/15
    - ipBlock:
        cidr: 192.172.0.0/14
    - ipBlock:
        cidr: 192.176.0.0/12
    - ipBlock:
        cidr: 192.192.0.0/10
    - ipBlock:
        cidr: 193.0.0.0/8
    - ipBlock:
        cidr: 194.0.0.0/7
    - ipBlock:
        cidr: 196.0.0.0/6
    - ipBlock:
        cidr: 200.0.0.0/5
    - ipBlock:
        cidr: 208.0.0.0/4
    - ipBlock:
        cidr: 224.0.0.0/3
    ports:
    - protocol: TCP
      port: 587
