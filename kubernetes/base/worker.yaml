apiVersion: apps/v1
kind: Deployment
metadata: {name: northstar-worker, namespace: northstar}
spec:
  replicas: 2
  selector: {matchLabels: {app: northstar-worker}}
  template:
    metadata: {labels: {app: northstar-worker, app.kubernetes.io/part-of: northstar}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: northstar-worker}}}
      containers:
        - name: worker
          image: northstar/api:replace-with-immutable-tag
          # RabbitMQ 4.3 rejects transient nonexclusive control/event queues.
          # Consume eight work queues, below the managed broker's per-channel limit.
          # Dead-letter queues are retained for review and must not be executed automatically.
          command: [celery, -A, northstar_api.workers.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2, "--queues=ingest.source,operations,whatsapp.inbound,whatsapp.outbound,telegram.outbound,instagram.outbound,facebook_messenger.outbound,slack.outbound", control_queue_exclusive=True, event_queue_exclusive=True]
          readinessProbe:
            exec:
              command: [python, -c, 'import socket; from northstar_api.workers.celery_app import celery_app; celery_app.conf.control_queue_exclusive = True; assert celery_app.control.inspect(destination=["celery@" + socket.gethostname()], timeout=4).ping()']
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          envFrom: [{configMapRef: {name: northstar-config}}, {secretRef: {name: northstar-secrets}}]
          env: [{name: DATABASE_APPLY_RUNTIME_ROLE, value: "false"}, {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: northstar-worker-secrets, key: DATABASE_URL}}}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
