apiVersion: apps/v1
kind: Deployment
metadata: {name: northstar-website-scheduler, namespace: northstar}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: northstar-website-scheduler}}
  template:
    metadata: {labels: {app: northstar-website-scheduler, app.kubernetes.io/part-of: northstar}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: website-scheduler
          image: northstar/api:replace-with-immutable-tag
          command: [python, -m, northstar_api.workers.website_scheduler]
          envFrom: [{configMapRef: {name: northstar-config}}, {secretRef: {name: northstar-secrets}}]
          env: [{name: DATABASE_APPLY_RUNTIME_ROLE, value: "false"}, {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: northstar-worker-secrets, key: DATABASE_URL}}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          readinessProbe:
            exec: {command: [python, -m, northstar_api.workers.worker_process_probe, --expect, northstar_api.workers.website_scheduler]}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [python, -m, northstar_api.workers.worker_process_probe, --expect, northstar_api.workers.website_scheduler]}
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 128Mi}}]
