apiVersion: batch/v1
kind: Job
metadata: {name: northstar-migrate, namespace: northstar}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: northstar-migrate, app.kubernetes.io/part-of: northstar}}
    spec:
      restartPolicy: Never
      serviceAccountName: northstar-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: northstar/api:replace-with-immutable-tag
          command: [sh, -ec, "alembic upgrade heads && python -m northstar_api.workers.help_content_sync"]
          envFrom: [{configMapRef: {name: northstar-config}}, {secretRef: {name: northstar-secrets}}]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: northstar-migration-secrets, key: DATABASE_URL}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
