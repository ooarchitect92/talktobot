name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA published by the release workflow
        required: true
        type: string
      health_url:
        description: Public HTTPS health URL checked after rollout
        required: true
        default: https://staging.talktobot.com/healthz
        type: string

permissions:
  contents: read
  attestations: read
  packages: read
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      AWS_REGION: ap-south-1
      STAGING_ALLOWED_CIDRS: ${{ vars.STAGING_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, ref: '${{ inputs.release_sha }}'}
      - name: Validate immutable release input
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_sha must be a full lowercase Git commit SHA' >&2; exit 1; }
          test "$HEALTH_URL" = https://staging.talktobot.com/healthz || { echo 'Only the staging HTTPS health endpoint is allowed' >&2; exit 1; }
      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in talktobot-api talktobot-web talktobot-website; do
            reference="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}"
            digest=$(docker buildx imagetools inspect "${reference}:sha-${RELEASE_SHA}" | awk '$1 == "Digest:" {print $2; exit}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
            gh attestation verify \
              "oci://${reference}@${digest}" \
              --repo "$GITHUB_REPOSITORY" --source-digest "$RELEASE_SHA"
            printf '%s=%s\n' "$image" "$digest" >> "$RUNNER_TEMP/release-digests.env"
          done
      - name: Assume least-privilege AWS deployment role
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN" || { echo 'AWS_DEPLOY_ROLE_ARN is required' >&2; exit 1; }
          oidc=$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          test -n "$oidc"
          credentials=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" --role-session-name "talktobot-${GITHUB_RUN_ID}" --web-identity-token "$oidc" --duration-seconds 3600)
          for name in AccessKeyId SecretAccessKey SessionToken; do
            value=$(printf '%s' "$credentials" | jq -r ".Credentials.${name}")
            echo "::add-mask::$value"
            case "$name" in AccessKeyId) key=AWS_ACCESS_KEY_ID ;; SecretAccessKey) key=AWS_SECRET_ACCESS_KEY ;; SessionToken) key=AWS_SESSION_TOKEN ;; esac
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Configure cluster credentials
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          test "$EKS_CLUSTER_NAME" = talktobot-staging || { echo 'Expected isolated staging cluster' >&2; exit 1; }
          install -d -m 0700 "$RUNNER_TEMP/kube"
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --kubeconfig "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Install signed AWS Session Manager plugin
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssm-gpg"
          export GNUPGHOME="$RUNNER_TEMP/ssm-gpg"
          gpg --batch --import scripts/aws-session-manager-signing-key.asc
          fingerprint=$(gpg --batch --with-colons --fingerprint 2C4D4AFF6F6757EE | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 7959637124CE093AD501D47A2C4D4AFF6F6757EE
          base=https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit
          curl --fail --silent --show-error "$base/session-manager-plugin.deb" -o "$RUNNER_TEMP/ssm.deb"
          curl --fail --silent --show-error "$base/session-manager-plugin.deb.sig" -o "$RUNNER_TEMP/ssm.deb.sig"
          gpg --batch --verify "$RUNNER_TEMP/ssm.deb.sig" "$RUNNER_TEMP/ssm.deb"
          sudo dpkg -i "$RUNNER_TEMP/ssm.deb"
      - name: Connect to private staging Kubernetes endpoint
        run: python scripts/connect-staging-ci.py
      - name: Verify private ECR copies retain the attested digests
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_ALLOWED_CIDRS: ${{ vars.STAGING_ALLOWED_CIDRS }}
        run: |
          for component in api web website; do
            expected=$(awk -F= -v key="talktobot-${component}" '$1 == key {print $2}' "$RUNNER_TEMP/release-digests.env")
            actual=$(aws ecr describe-images --repository-name "talktobot-staging/${component}" --image-ids "imageTag=sha-${RELEASE_SHA}" --query 'imageDetails[0].imageDigest' --output text)
            test "$actual" = "$expected" || { echo 'ECR image differs from verified provenance' >&2; exit 1; }
          done
      - name: Render the exact release
        working-directory: kubernetes/overlays/staging
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_ALLOWED_CIDRS: ${{ vars.STAGING_ALLOWED_CIDRS }}
        run: |
          for component in api web website; do
            digest=$(awk -F= -v key="talktobot-${component}" '$1 == key {print $2}' "$RUNNER_TEMP/release-digests.env")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            kubectl kustomize . >/dev/null
            python ../../../scripts/pin-release-image.py kustomization.yaml "northstar/${component}" "$digest"
          done
          python ../../../scripts/set-staging-ingress-access.py ingress.yaml --cidrs "$STAGING_ALLOWED_CIDRS"
          kubectl kustomize . | awk 'BEGIN {RS="---"; ORS="---\n"} !/kind: Namespace/ && NF {print}' > "$RUNNER_TEMP/northstar.yaml"
          awk 'BEGIN {RS="---"; ORS="---\n"} /kind: Job/ {print}' "$RUNNER_TEMP/northstar.yaml" > "$RUNNER_TEMP/migration.yaml"
          awk 'BEGIN {RS="---"; ORS="---\n"} /kind: (ConfigMap|ServiceAccount|NetworkPolicy)/ {print}' "$RUNNER_TEMP/northstar.yaml" > "$RUNNER_TEMP/prerequisites.yaml"
          awk 'BEGIN {RS="---"; ORS="---\n"} !/kind: Job/ && NF {print}' "$RUNNER_TEMP/northstar.yaml" > "$RUNNER_TEMP/application.yaml"
          ! grep -q 'replace-with-' "$RUNNER_TEMP/northstar.yaml"
          ! grep -Eq 'image: .*:(latest|main|master)$' "$RUNNER_TEMP/northstar.yaml"
      - name: Server-side validation
        run: kubectl apply --server-side --dry-run=server -f "$RUNNER_TEMP/northstar.yaml"
      - name: Apply migration configuration and network prerequisites
        run: kubectl apply --server-side -f "$RUNNER_TEMP/prerequisites.yaml"
      - name: Synchronize private staging runtime and migration credentials
        run: python scripts/sync-staging-secrets.py --kubeconfig "$KUBECONFIG"
      - name: Verify staging prerequisites
        run: |
          kubectl get secret northstar-secrets --namespace northstar
          kubectl auth can-i create jobs.batch --namespace northstar | grep -qx yes
          kubectl auth can-i patch deployments.apps --namespace northstar | grep -qx yes
      - name: Run migration release gate
        run: |
          kubectl delete job northstar-migrate --namespace northstar --ignore-not-found --wait=true
          kubectl apply -f "$RUNNER_TEMP/migration.yaml"
          kubectl wait --for=condition=complete job/northstar-migrate --namespace northstar --timeout=15m
      - name: Protect application routes before exposing provider callbacks
        env:
          STAGING_ALLOWED_CIDRS: ${{ vars.STAGING_ALLOWED_CIDRS }}
        run: python scripts/prepare-staging-callback-access.py --cidrs "$STAGING_ALLOWED_CIDRS"
      - name: Roll out application workloads
        run: |
          kubectl apply --server-side -f "$RUNNER_TEMP/application.yaml"
          for deployment in $(kubectl get deployments --namespace northstar -o json | jq -r '.items[] | select(.spec.replicas > 0) | "deployment/" + .metadata.name'); do
            kubectl rollout status "$deployment" --namespace northstar --timeout=10m
          done
      - name: Publish verified staging load balancer DNS aliases
        run: python scripts/publish-staging-dns.py
      - name: Verify public health
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          # Validation originates from staging's allowlisted NAT address. The
          # hosted runner is deliberately not granted public ingress access.
          for attempt in $(seq 1 12); do
            if kubectl exec --namespace northstar deployment/northstar-api -- python -c 'import sys, urllib.request; response = urllib.request.urlopen(sys.argv[1], timeout=10); assert response.status == 200; print("Staging HTTPS health passed")' "$HEALTH_URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Deployment diagnostics
        if: failure()
        run: |
          kubectl get all --namespace northstar
          kubectl get events --namespace northstar --sort-by=.lastTimestamp | tail -100
      - name: Close private tunnel
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/kube/tunnel.pid"; then
            kill "$(cat "$RUNNER_TEMP/kube/tunnel.pid")" || true
          fi
