name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Re-verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Require passing complete CI for this immutable commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          result="$(gh api "repos/$RELEASE_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&per_page=100" --jq 'any(.workflow_runs[]; .conclusion == "success")')"
          test "$result" = true || { echo 'Complete CI, including topology acceptance, must pass for this exact commit before release.' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 26, cache: npm}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Validate repository architecture
        run: bash scripts/validate-architecture.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm ci --prefix website --no-audit --no-fund
      - run: npm run build --prefix website && npm test --prefix website
      - run: uv sync --project backend --all-groups --locked
      - run: uv run --project backend ruff check backend && uv run --project backend ruff format --check backend
      - run: uv run --project backend mypy --config-file backend/pyproject.toml backend/src
      - run: uv run --project backend pytest -c backend/pyproject.toml backend/tests
      - run: cp .env.example .env && docker compose config --quiet && kubectl kustomize kubernetes/overlays/production >/dev/null
      - name: Validate release-time public origin
        env:
          S3_PUBLIC_ENDPOINT_URL: ${{ vars.S3_PUBLIC_ENDPOINT_URL }}
        run: |
          test -n "$S3_PUBLIC_ENDPOINT_URL" || { echo 'Repository variable S3_PUBLIC_ENDPOINT_URL is required' >&2; exit 1; }
          [[ "$S3_PUBLIC_ENDPOINT_URL" =~ ^https://[^[:space:]]+$ ]] || { echo 'S3_PUBLIC_ENDPOINT_URL must be one HTTPS origin' >&2; exit 1; }
      - name: Scan secrets with the verified CLI
        run: python scripts/scan-secrets.py

  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [verify]
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: backend
            dockerfile: backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/talktobot-api
            build_args: ""
          - component: web
            context: .
            dockerfile: frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/talktobot-web
            build_args: |
              VITE_API_URL=/api/v1
              VITE_DEMO_MODE=false
              S3_PUBLIC_ENDPOINT_URL=${{ vars.S3_PUBLIC_ENDPOINT_URL }}
              WEB_CSP_EXTRA_CONNECT_SRC=${{ vars.S3_PUBLIC_ENDPOINT_URL }}
          - component: website
            context: website
            dockerfile: website/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/talktobot-website
            build_args: |
              VITE_APP_URL=https://app.talktobot.com
              VITE_SITE_URL=https://talktobot.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
          build-args: ${{ matrix.build_args }}
      - name: Block high and critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Mirror the verified image into private staging ECR
        env:
          ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          SOURCE_IMAGE: ${{ matrix.image }}
          SOURCE_DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
          AWS_REGION: ap-south-1
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$ROLE_ARN" || { echo 'AWS_ECR_PUBLISH_ROLE_ARN is required' >&2; exit 1; }
          oidc=$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          credentials=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" --role-session-name "talktobot-images-${GITHUB_RUN_ID}" --web-identity-token "$oidc" --duration-seconds 3600)
          for name in AccessKeyId SecretAccessKey SessionToken; do
            value=$(printf '%s' "$credentials" | jq -r ".Credentials.${name}")
            echo "::add-mask::$value"
            case "$name" in AccessKeyId) export AWS_ACCESS_KEY_ID="$value" ;; SecretAccessKey) export AWS_SECRET_ACCESS_KEY="$value" ;; SessionToken) export AWS_SESSION_TOKEN="$value" ;; esac
          done
          test "$(aws sts get-caller-identity --query Account --output text)" = 510439383733
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          registry=510439383733.dkr.ecr.ap-south-1.amazonaws.com
          aws ecr get-login-password | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username AWS --password-stdin "$registry"
          skopeo copy --all --preserve-digests "docker://${SOURCE_IMAGE}@${SOURCE_DIGEST}" "docker://${registry}/talktobot-staging/${COMPONENT}:sha-${GITHUB_SHA}"
          actual=$(aws ecr describe-images --repository-name "talktobot-staging/${COMPONENT}" --image-ids "imageTag=sha-${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)
          test "$actual" = "$SOURCE_DIGEST" || { echo 'ECR mirror digest mismatch' >&2; exit 1; }

  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    needs: [publish]
    steps:
      - run: echo "All immutable images, SBOMs, vulnerability gates, and provenance attestations passed."
